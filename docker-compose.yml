# Development stack. Tests and experiments talk to the dind sidecar so the
# host's Docker daemon is never touched.
services:
  ki-agent:
    build: .
    environment:
      KI_DATA_DIR: /var/lib/ki-agent
      KI_SOCKET_PATH: /run/ki-agent/ki.sock
      KI_LOG_LEVEL: debug
      KI_DOCKER_HOST: tcp://dind:2375
    volumes:
      - ki-agent-data:/var/lib/ki-agent
      - ki-agent-run:/run/ki-agent
    depends_on:
      dind:
        condition: service_healthy
    networks:
      - devmesh
      - testnet

  # Docker-in-Docker: the only engine tests ever talk to, so the host's Docker
  # daemon is never touched. Private network; it does not need devmesh.
  dind:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      # The edge proxy's bind mounts are resolved by this engine, so the paths
      # the agent writes must exist here at the same location: the shared test
      # directory, and the dev agent's data directory.
      - ki-shared:/shared
      - ki-agent-data:/var/lib/ki-agent
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - testnet

  # Runs the full suite (including the Docker integration tests) against dind:
  #   docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: packaging/test/Dockerfile.runner
    profiles: ["test"]  # not started by a bare `docker compose up`
    working_dir: /src
    command: ["go", "test", "-race", "-count=1", "./..."]
    environment:
      KI_TEST_DOCKER_HOST: tcp://dind:2375
      # Mounted at the same path in dind; the edge integration test needs it.
      KI_TEST_SHARED_DIR: /shared
      GOCACHE: /go-cache/build
      GOMODCACHE: /go-cache/mod
    volumes:
      - .:/src
      - go-cache:/go-cache
      - ki-shared:/shared
    depends_on:
      dind:
        condition: service_healthy
    networks:
      - testnet

  # Runs install.sh in a plain Debian container against a fake release; Docker,
  # git, ssh and systemctl are stubbed:
  #   docker compose --profile test run --rm install-test
  install-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: packaging/test/Dockerfile
    command: ["sh", "/src/packaging/test/install-test.sh"]
    volumes:
      - .:/src:ro

volumes:
  ki-agent-data:
  ki-agent-run:
  go-cache:
  ki-shared:

networks:
  devmesh:
    external: true
  testnet:
