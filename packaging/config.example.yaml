# ki-agent configuration. Copy to /etc/ki-agent/config.yaml.
# Every key is optional; the values shown are the defaults.
# Each key can also be overridden by an environment variable named
# KI_<KEY PATH IN UPPER CASE>, e.g. KI_DATA_DIR, KI_SOCKET_PATH,
# KI_API_LISTEN, KI_PANEL_ENABLED, KI_DOCKER_HOST, KI_WEBHOOKS_LISTEN,
# KI_DEPLOYS_KEEP, KI_EDGE_DOMAIN, KI_CONTROL_PLANE_URL.

# Directory for all agent state; the only path the agent writes to.
data_dir: /var/lib/ki-agent

# Log verbosity: debug, info, warn or error. Logs are JSON on stderr.
log_level: info

# Local Unix socket used by the ki-agent CLI. Access is controlled by file mode.
socket:
  path: /run/ki-agent/ki.sock
  # Octal file mode of the socket.
  mode: 0660

# HTTP/WebSocket API. Both listeners bind loopback only; remote access goes
# through the edge. Bearer tokens are created with `ki-agent tokens create`.
api:
  # Direct loopback host:port for local scripts: /rpc (tokens and sessions),
  # /auth/* and the panel.
  listen: 127.0.0.1:8091
  # Loopback host:port the edge routes to. Must differ from listen and from the
  # webhooks port. May be empty only when the edge is disabled.
  edge_listen: 127.0.0.1:8092
  # Accept bearer tokens on /rpc through the edge (sessions always work).
  public_tokens: false
  # How often the agent pings the client.
  heartbeat_interval: 15s
  # Connections with no pong within this time are closed.
  # Must be greater than heartbeat_interval.
  heartbeat_timeout: 45s

# Web panel (sign-in, setup links). When disabled, /auth/* and / return 404.
panel:
  enabled: true
  # https origin used to build setup links, e.g. https://ki.example.com.
  # Empty derives it from edge.domain or the host. No path, query or fragment.
  public_url: ""
  # Sessions expire after this much inactivity...
  session_idle: 12h
  # ...or this long after sign-in, whichever comes first (must be >= idle).
  session_max: 168h

# Container engine the agent manages containers on. The agent starts even if
# the engine is down; container methods fail with RuntimeUnavailable until it
# is reachable. The service user needs access to the endpoint (the systemd unit
# adds the docker group).
docker:
  # unix:// or tcp:// endpoint.
  host: unix:///var/run/docker.sock
  # docker executable (with the compose v2 plugin) used to run deploys.
  # A bare name is looked up in PATH.
  cli: docker
  # Docker client config directory (DOCKER_CONFIG) deploys run with. Registry
  # logins (`docker login`) and credential helpers (config.json) live here.
  # Empty uses <data_dir>/docker, created by the agent with mode 0700.
  config_dir: ""

# Inbound webhook listener that triggers deploys on git pushes/tags.
webhooks:
  # host:port to listen on. Empty (default) disables the listener.
  # Example: 127.0.0.1:8090 (loopback may be plain HTTP behind a proxy).
  listen: ""
  # PEM certificate and key for HTTPS. Both are required when listen is not a
  # loopback address.
  tls_cert_file: ""
  tls_key_file: ""
  # Maximum accepted request body size in bytes (5 MiB).
  max_body_bytes: 5242880

# Deploy execution and history retention.
deploys:
  # How long a deploy waits for services to become healthy.
  health_timeout: 5m
  # Number of deploys kept per project; older ones are pruned.
  keep: 50
  # Maximum stored log size per deploy in bytes (1 MiB).
  log_max_bytes: 1048576
  # always: refresh image-only services (docker compose pull) before every
  # deploy. missing: only pull images that are absent when starting.
  pull: always

# Managed reverse proxy (edge) that routes project domains to services.
edge:
  # Run the edge proxy.
  enabled: true
  # Proxy container image. Empty selects the pinned default.
  image: ""
  # front: the edge owns the public ports and obtains certificates.
  # behind: the edge listens on behind_listen in plain HTTP only, behind an
  # existing web server (nginx, Caddy) that terminates TLS and forwards the
  # migrated domains to it. See `ki-agent edge proxy-config`.
  mode: front
  # Behind mode: loopback IP:port the edge binds (not the public ports).
  behind_listen: 127.0.0.1:8480
  # Front mode: host ports the proxy publishes for HTTP and HTTPS (ignored in
  # behind mode).
  http_port: 80
  https_port: 443
  # Domain of this server. Front mode: served with an ACME certificate. Behind
  # mode: a server hostname (panel, webhooks) reached through the front proxy,
  # with no certificate requested. Lowercase DNS name with at least one dot
  # (no wildcard or IP). Empty disables it.
  domain: ""
  # Optional contact email for the ACME account.
  acme_email: ""
  # Loopback port used for the webhook listener when webhooks.listen is empty.
  webhooks_port: 8090

# Resource monitoring (stats). The agent always samples the host and the
# managed containers in the background at the base intervals below, and
# faster (down to 1s for the host, 2s for containers) while a client is
# subscribed to host.subscribe / containers.stats.subscribe or running
# `ki-agent stats --watch`. History is kept in memory only.
monitor:
  # Base host (CPU, memory, disk, network) sampling period. At least 1s.
  host_interval: 15s
  # Base container sampling period. At least 2s.
  container_interval: 30s
  # How far back in-memory history is kept. At most 24h.
  history: 1h
  # Spacing of retained history samples. At least 1s, at most history.
  history_resolution: 15s
  # Extra absolute mount points reported as disks, in addition to the
  # filesystems holding "/" and data_dir. Env: comma-separated.
  disk_paths: []

# Optional outbound connection to a control plane. The agent dials out and
# reconnects with exponential backoff, so no inbound port needs to be open.
control_plane:
  # WebSocket URL of the control plane. Empty (default) disables the connection.
  # wss:// is required; ws:// is accepted only for loopback hosts.
  # When set, token_file is required.
  url: ""
  # File containing the bearer token the agent presents to the control plane.
  # Must exist and be non-empty.
  token_file: ""
  # Optional PEM file with extra CA certificates, added to the system roots.
  ca_file: ""
  # How often the agent pings the control plane.
  heartbeat_interval: 15s
  # The connection is dropped and re-established if no pong arrives within
  # this time. Must be greater than heartbeat_interval.
  heartbeat_timeout: 45s
  # Initial delay before reconnecting; doubles on each failed attempt.
  reconnect_min: 1s
  # Upper bound for the reconnect delay. Must be at least reconnect_min.
  reconnect_max: 60s
