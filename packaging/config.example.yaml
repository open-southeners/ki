# ki-agent configuration. Copy to /etc/ki-agent/config.yaml.
# Every key is optional; the values shown are the defaults.
# Each key can also be overridden by an environment variable named
# KI_<KEY PATH IN UPPER CASE>, e.g. KI_DATA_DIR, KI_SOCKET_PATH,
# KI_WEBSOCKET_TOKEN_FILE, KI_DOCKER_HOST, KI_WEBHOOKS_LISTEN,
# KI_DEPLOYS_KEEP, KI_EDGE_DOMAIN, KI_CONTROL_PLANE_URL.

# Directory for all agent state; the only path the agent writes to.
data_dir: /var/lib/ki-agent

# Log verbosity: debug, info, warn or error. Logs are JSON on stderr.
log_level: info

# Local Unix socket used by the ki-agent CLI. Access is controlled by file mode.
socket:
  path: /run/ki-agent/ki.sock
  # Octal file mode of the socket.
  mode: 0660

# Authenticated WebSocket listener for remote control planes.
websocket:
  # host:port to listen on. Empty (default) disables the listener.
  # When set, token_file is required: the agent never serves unauthenticated.
  listen: ""
  # HTTP path of the JSON-RPC endpoint.
  path: /rpc
  # File containing the bearer token clients must send as
  # "Authorization: Bearer <token>". Must exist and be non-empty.
  token_file: ""
  # How often the agent pings the client.
  heartbeat_interval: 15s
  # Connections with no pong within this time are closed.
  # Must be greater than heartbeat_interval.
  heartbeat_timeout: 45s

# Container engine the agent manages containers on. The agent starts even if
# the engine is down; container methods fail with RuntimeUnavailable until it
# is reachable. The service user needs access to the endpoint (the systemd unit
# adds the docker group).
docker:
  # unix:// or tcp:// endpoint.
  host: unix:///var/run/docker.sock
  # docker executable (with the compose v2 plugin) used to run deploys.
  # A bare name is looked up in PATH.
  cli: docker

# Inbound webhook listener that triggers deploys on git pushes/tags.
webhooks:
  # host:port to listen on. Empty (default) disables the listener.
  # Example: 127.0.0.1:8090 (loopback may be plain HTTP behind a proxy).
  listen: ""
  # PEM certificate and key for HTTPS. Both are required when listen is not a
  # loopback address.
  tls_cert_file: ""
  tls_key_file: ""
  # Maximum accepted request body size in bytes (5 MiB).
  max_body_bytes: 5242880

# Deploy execution and history retention.
deploys:
  # How long a deploy waits for services to become healthy.
  health_timeout: 5m
  # Number of deploys kept per project; older ones are pruned.
  keep: 50
  # Maximum stored log size per deploy in bytes (1 MiB).
  log_max_bytes: 1048576

# Managed reverse proxy (edge) that routes project domains to services.
edge:
  # Run the edge proxy.
  enabled: true
  # Proxy container image. Empty selects the pinned default.
  image: ""
  # Host ports the proxy publishes for HTTP and HTTPS.
  http_port: 80
  https_port: 443
  # Domain of this server, served with ACME certificates. Lowercase DNS name
  # with at least one dot (no wildcard or IP). Empty disables it.
  domain: ""
  # Optional contact email for the ACME account.
  acme_email: ""
  # Loopback port used for the webhook listener when webhooks.listen is empty.
  webhooks_port: 8090

# Optional outbound connection to a control plane. The agent dials out and
# reconnects with exponential backoff, so no inbound port needs to be open.
control_plane:
  # WebSocket URL of the control plane. Empty (default) disables the connection.
  # wss:// is required; ws:// is accepted only for loopback hosts.
  # When set, token_file is required.
  url: ""
  # File containing the bearer token the agent presents to the control plane.
  # Must exist and be non-empty.
  token_file: ""
  # Optional PEM file with extra CA certificates, added to the system roots.
  ca_file: ""
  # How often the agent pings the control plane.
  heartbeat_interval: 15s
  # The connection is dropped and re-established if no pong arrives within
  # this time. Must be greater than heartbeat_interval.
  heartbeat_timeout: 45s
  # Initial delay before reconnecting; doubles on each failed attempt.
  reconnect_min: 1s
  # Upper bound for the reconnect delay. Must be at least reconnect_min.
  reconnect_max: 60s
