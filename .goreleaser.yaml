# GoReleaser configuration (v2). Releases are cut by .github/workflows/release.yml.
version: 2

project_name: ki-agent

before:
  hooks:
    - go mod download
    # The panel is embedded into the binary, so build it first.
    - sh -c "cd web && bun install --frozen-lockfile && bun run build"

builds:
  - id: ki-agent
    main: ./cmd/ki-agent
    binary: ki-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/open-southeners/ki-agent/internal/version.Version={{ .Version }}
      - -X github.com/open-southeners/ki-agent/internal/version.Commit={{ .Commit }}
      - -X github.com/open-southeners/ki-agent/internal/version.EnrollURL={{ index .Env "KI_ENROLL_URL" }}

# No version in the archive name, so releases/latest/download/<name> works.
archives:
  - id: ki-agent
    formats: [tar.gz]
    name_template: "ki-agent_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: packaging/systemd/ki-agent.service
        dst: ki-agent.service
      - src: packaging/systemd/ki-agent-update.service
        dst: ki-agent-update.service
      - src: packaging/systemd/ki-agent-update.path
        dst: ki-agent-update.path
      - src: packaging/config.example.yaml
        dst: config.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./install.sh

# install.sh is published as a plain release asset.
release:
  prerelease: auto
  github:
    owner: open-southeners
    name: ki-agent
  extra_files:
    - glob: ./install.sh

# Both signatures cover the checksums file; both are skipped with --skip=sign.
signs:
  # Keyless signature (bundle) for manual verification.
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

  # ed25519 signature the agent's updater verifies against its compiled-in key.
  - id: ed25519
    cmd: go
    env:
      - KI_RELEASE_SIGNING_KEY={{ .Env.KI_RELEASE_SIGNING_KEY }}
    signature: "${artifact}.sig"
    args:
      - run
      - ./tools/release-sign
      - sign
      - --tag
      - "{{ .Tag }}"
      - --in
      - "${artifact}"
      - --out
      - "${signature}"
    artifacts: checksum
    output: true

changelog:
  disable: true
