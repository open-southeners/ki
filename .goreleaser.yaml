# GoReleaser configuration (v2). Releases are cut by .github/workflows/release.yml.
version: 2

project_name: ki-agent

before:
  hooks:
    - go mod download
    # The panel is embedded into the binary, so build it first.
    - sh -c "cd web && bun install --frozen-lockfile && bun run build"

# One binary, shipped under two names: `ki` is the CLI and `ki-agent` is the
# same program for units and scripts that predate the rename (invoked as
# ki-agent it behaves like `ki agent`). Both are regular files in the archive.
builds:
  - id: ki
    main: ./cmd/ki
    binary: ki
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags: &ldflags
      - -s -w
      - -X github.com/open-southeners/ki/internal/version.Version={{ .Version }}
      - -X github.com/open-southeners/ki/internal/version.Commit={{ .Commit }}
      - -X github.com/open-southeners/ki/internal/version.EnrollURL={{ index .Env "KI_ENROLL_URL" }}

  - id: ki-agent-alias
    main: ./cmd/ki
    binary: ki-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags: *ldflags

  # The same CLI for laptops (`ki login` and the Kiarga commands); `ki agent
  # run` refuses to start off Linux.
  - id: ki-laptop
    main: ./cmd/ki
    binary: ki
    env:
      - CGO_ENABLED=0
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags: *ldflags

# No version in the archive name, so releases/latest/download/<name> works.
archives:
  - id: ki-agent
    ids: [ki, ki-agent-alias]
    formats: [tar.gz]
    name_template: "ki-agent_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: packaging/systemd/ki-agent.service
        dst: ki-agent.service
      - src: packaging/systemd/ki-agent-update.service
        dst: ki-agent-update.service
      - src: packaging/systemd/ki-agent-update.path
        dst: ki-agent-update.path
      - src: packaging/config.example.yaml
        dst: config.example.yaml

  # Laptop CLI: ki_<os>_<arch>.tar.gz (zip on Windows).
  - id: ki-laptop
    ids: [ki-laptop]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ki_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Homebrew cask for macOS, published to open-southeners/homebrew-tap. The
# upload is skipped when HOMEBREW_TAP_GITHUB_TOKEN is not set, so a release
# never fails for lack of the tap token.
homebrew_casks:
  - name: ki
    ids: [ki-laptop]
    description: Command-line client for Kiarga and the ki agent
    homepage: https://github.com/open-southeners/ki
    license: Apache-2.0
    binaries: [ki]
    directory: Casks
    repository:
      owner: open-southeners
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") }}'
    # The binary is not notarized; clear the quarantine flag so macOS runs it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/ki"]
          end

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./install.sh

# The release workflow creates the release (notes from CHANGELOG.md) before
# GoReleaser runs; keep-existing uploads assets and leaves name and body alone.
# install.sh is published as a plain release asset.
release:
  mode: keep-existing
  prerelease: auto
  github:
    owner: open-southeners
    name: ki
  extra_files:
    - glob: ./install.sh

# Both signatures cover the checksums file; both are skipped with --skip=sign.
signs:
  # Keyless signature (bundle) for manual verification.
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

  # ed25519 signature the agent's updater verifies against its compiled-in key.
  # The command inherits GoReleaser's environment, so KI_RELEASE_SIGNING_KEY
  # (set by the release workflow) reaches it; release-sign fails when it is
  # unset. Do not template it into `env:` here: in a sign entry's env list,
  # {{ .Env }} only sees the entries above it, never the process environment.
  - id: ed25519
    cmd: go
    signature: "${artifact}.sig"
    args:
      - run
      - ./tools/release-sign
      - sign
      - --tag
      - "{{ .Tag }}"
      - --in
      - "${artifact}"
      - --out
      - "${signature}"
    artifacts: checksum
    output: true

changelog:
  disable: true
