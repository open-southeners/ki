http:
    routers:
        ki-hooks-acme:
            entryPoints:
                - websecure
            priority: 20000
            rule: Host(`panel.example.com`) && PathPrefix(`/hooks/`)
            service: ki-webhooks
            tls:
                certResolver: le
        ki-hooks-catchall:
            entryPoints:
                - websecure
            priority: 1
            rule: HostRegexp(`^.+$`) && PathPrefix(`/hooks/`)
            service: ki-webhooks
            tls: {}
        ki-hooks-installed:
            entryPoints:
                - websecure
            priority: 20000
            rule: (Host(`a.cp.example.net`) || Host(`z.cp.example.net`)) && PathPrefix(`/hooks/`)
            service: ki-webhooks
            tls: {}
        p-blog-api-f39b180c:
            entryPoints:
                - websecure
            priority: 10000
            rule: Host(`blog.example.com`) && PathPrefix(`/api`)
            service: p-blog-api-f39b180c
            tls:
                certResolver: le
        p-shop-web-43829c56:
            entryPoints:
                - websecure
            priority: 10000
            rule: (Host(`shop.example.com`) || Host(`www.shop.example.com`))
            service: p-shop-web-43829c56
            tls:
                certResolver: le
    services:
        ki-webhooks:
            loadBalancer:
                servers:
                    - url: http://127.0.0.1:8090
        p-blog-api-f39b180c:
            loadBalancer:
                servers:
                    - url: http://172.21.0.2:3000
        p-shop-web-43829c56:
            loadBalancer:
                servers:
                    - url: http://172.20.0.2:8080
                    - url: http://172.20.0.3:8080
tls:
    certificates:
        - certFile: /etc/traefik/certs/a.cp.example.net.crt
          keyFile: /etc/traefik/certs/a.cp.example.net.key
        - certFile: /etc/traefik/certs/z.cp.example.net.crt
          keyFile: /etc/traefik/certs/z.cp.example.net.key
    stores:
        default:
            defaultCertificate:
                certFile: /etc/traefik/selfsigned/selfsigned.crt
                keyFile: /etc/traefik/selfsigned/selfsigned.key
