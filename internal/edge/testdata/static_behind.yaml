entryPoints:
    web:
        address: 127.0.0.1:8480
        forwardedHeaders:
            trustedIPs:
                - 127.0.0.1/32
                - ::1/128
global:
    checkNewVersion: false
    sendAnonymousUsage: false
log:
    level: INFO
providers:
    file:
        directory: /etc/traefik/dynamic
        watch: true
