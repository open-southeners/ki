http:
    routers:
        ki-hooks-ip:
            entryPoints:
                - websecure
            priority: 20000
            rule: (HostRegexp(`^[0-9]{1,3}(\.[0-9]{1,3}){3}$`) || HostRegexp(`^\[?[0-9a-f]*:[0-9a-f:.]*\]?$`)) && PathPrefix(`/hooks/`)
            service: ki-webhooks
            tls: {}
    services:
        ki-webhooks:
            loadBalancer:
                servers:
                    - url: http://127.0.0.1:8090
