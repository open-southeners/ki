http:
    routers:
        ki-auth-acme:
            entryPoints:
                - web
            priority: 20000
            rule: Host(`panel.example.com`) && PathPrefix(`/auth/`)
            service: ki-panel
        ki-auth-installed:
            entryPoints:
                - web
            priority: 20000
            rule: (Host(`a.cp.example.net`) || Host(`ops.example.net`) || Host(`z.cp.example.net`)) && PathPrefix(`/auth/`)
            service: ki-panel
        ki-hooks-acme:
            entryPoints:
                - web
            priority: 20000
            rule: Host(`panel.example.com`) && PathPrefix(`/hooks/`)
            service: ki-webhooks
        ki-hooks-installed:
            entryPoints:
                - web
            priority: 20000
            rule: (Host(`a.cp.example.net`) || Host(`ops.example.net`) || Host(`z.cp.example.net`)) && PathPrefix(`/hooks/`)
            service: ki-webhooks
        ki-panel-acme:
            entryPoints:
                - web
            priority: 19999
            rule: Host(`panel.example.com`) && PathPrefix(`/`)
            service: ki-panel
        ki-panel-installed:
            entryPoints:
                - web
            priority: 19999
            rule: (Host(`a.cp.example.net`) || Host(`ops.example.net`) || Host(`z.cp.example.net`)) && PathPrefix(`/`)
            service: ki-panel
        ki-rpc-acme:
            entryPoints:
                - web
            priority: 20000
            rule: Host(`panel.example.com`) && Path(`/rpc`)
            service: ki-panel
        ki-rpc-installed:
            entryPoints:
                - web
            priority: 20000
            rule: (Host(`a.cp.example.net`) || Host(`ops.example.net`) || Host(`z.cp.example.net`)) && Path(`/rpc`)
            service: ki-panel
        p-blog-api-f39b180c:
            entryPoints:
                - web
            priority: 10000
            rule: Host(`blog.example.com`) && PathPrefix(`/api`)
            service: p-blog-api-f39b180c
        p-shop-web-43829c56:
            entryPoints:
                - web
            priority: 10000
            rule: (Host(`shop.example.com`) || Host(`www.shop.example.com`))
            service: p-shop-web-43829c56
    services:
        ki-panel:
            loadBalancer:
                servers:
                    - url: http://127.0.0.1:8092
        ki-webhooks:
            loadBalancer:
                servers:
                    - url: http://127.0.0.1:8090
        p-blog-api-f39b180c:
            loadBalancer:
                servers:
                    - url: http://172.21.0.2:3000
        p-shop-web-43829c56:
            loadBalancer:
                servers:
                    - url: http://172.20.0.2:8080
                    - url: http://172.20.0.3:8080
